  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; background: #000; overflow-x: hidden; }

    .tile { position: absolute; overflow: hidden; }

    #header {

  <script>
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    if (tz === 'Australia/Hobart' || tz === 'Australia/Melbourne') {
      document.querySelector('#header-right p').textContent = 'Tasmanian Aerosol Artist';
    }
  </script>

  <script>
    {
      const vw     = window.innerWidth;
      const COLS   = vw < 560 ? 2 : vw < 900 ? 3 : 4;
      const COL_PC = 100 / COLS;
      const COL_PX = vw / COLS;
      const EAGER  = COLS;        // first row only: high-priority, no lazy
      const BATCH  = COLS * 4;

      const grid    = document.getElementById('grid');
      const colTops = new Array(COLS).fill(0);
      let shuffled = [], cursor = 0, busy = false;

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = (Math.random() * (i + 1)) | 0;
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function shortestCol() {
        let min = colTops[0], idx = 0;
        for (let i = 1; i < COLS; i++) if (colTops[i] < min) { min = colTops[i]; idx = i; }
        return idx;
      }

      const lazyObs = new IntersectionObserver((entries) => {
        for (const e of entries) {
          if (!e.isIntersecting) continue;
          const img = e.target;
          if (img.dataset.srcset) {
            img.sizes  = img.dataset.sizes;
            img.srcset = img.dataset.srcset;
            delete img.dataset.srcset;
            delete img.dataset.sizes;
          }
          lazyObs.unobserve(img);
        }
      }, { rootMargin: '300px 0px' });

      // Unload images that scroll more than ~2000px off screen
      const unloadObs = new IntersectionObserver((entries) => {
        for (const e of entries) {
          if (e.isIntersecting) continue;
          const img = e.target;
          if (!img.classList.contains('loaded')) continue;
          img.dataset.srcset = img.srcset;
          img.dataset.sizes  = img.sizes;
          img.removeAttribute('srcset');
          img.removeAttribute('src');
          img.classList.remove('loaded');
          lazyObs.observe(img);
        }
      }, { rootMargin: '2000px 0px' });

      function placeTile(item, eager) {
        const col = shortestCol();
        const hPx = COL_PX * (item.h / item.w);

        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.style.cssText = `left:${col*COL_PC}%;top:${colTops[col]}px;width:${COL_PC}%;height:${hPx}px`;

        const img = document.createElement('img');
        img.alt      = `Joel Gajda artwork ${cursor + 1}`;
        img.decoding = 'async';
        img.onload = img.onerror = () => img.classList.add('loaded');

        const srcset = `images/${item.sm} ${item.smw}w, images/${item.file} ${item.w}w`;
        const sizes  = '(max-width: 559px) 50vw, (max-width: 899px) 33vw, 25vw';
        if (eager) {
          img.sizes         = sizes;
          img.srcset        = srcset;
          img.fetchPriority = 'high';
        } else {
          img.dataset.srcset = srcset;
          img.dataset.sizes  = sizes;
        }

        tile.appendChild(img);
        grid.appendChild(tile);

        if (!eager) lazyObs.observe(img);
        unloadObs.observe(img);
        colTops[col] += hPx;
        grid.style.height = Math.max(...colTops) + 'px';
      }

      function addBatch(count) {
        if (busy || !shuffled.length) return;
        busy = true;
        const n = count || BATCH;
        for (let i = 0; i < n; i++) {
          placeTile(shuffled[cursor % shuffled.length], cursor < EAGER);
          cursor++;
        }
        busy = false;
      }

      function fillIfNeeded() {
        const dist = parseFloat(grid.style.height || 0) - (window.scrollY + window.innerHeight);
        if (dist < window.innerHeight * 1.5) addBatch();
      }

      window.addEventListener('scroll', fillIfNeeded, { passive: true });

      shuffled = shuffle(window.MANIFEST);
      // Keep adding batches until grid extends 1.5× viewport (handles small screens)
      let safety = 20;
      while (safety-- > 0) {
        const dist = parseFloat(grid.style.height || 0) - window.innerHeight;
        if (dist >= window.innerHeight * 1.5) break;
        addBatch();
      }
    }
  </script>
